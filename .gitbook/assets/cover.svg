  <!-- 마스코트 주변 반짝이 -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M700 470 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z"/>
    <path d="M1225 440 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
