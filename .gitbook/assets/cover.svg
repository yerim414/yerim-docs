<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" width="1920" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEDF5"/>
      <stop offset="45%" stop-color="#EFF3FF"/>
      <stop offset="100%" stop-color="#E6FAF1"/>
    </linearGradient>
    <radialGradient id="blobA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FFC2DC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFC2DC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#A8D8FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A8D8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#B9F0D2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#B9F0D2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="drop"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8E7CA8" flood-opacity="0.18"/></filter>
  </defs>

  <rect width="1920" height="640" fill="url(#bg)"/>

  <circle cx="330" cy="180" r="260" fill="url(#blobA)"/>
  <circle cx="1560" cy="470" r="300" fill="url(#blobB)"/>
  <circle cx="1180" cy="120" r="220" fill="url(#blobC)"/>
  <circle cx="720" cy="540" r="240" fill="url(#blobA)" opacity="0.5"/>

  <!-- 떠다니는 코드 카드 -->
  <g filter="url(#soft)" opacity="0.24">
