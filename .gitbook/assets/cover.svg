      <ellipse cx="0" cy="0" rx="57" ry="54" fill="#EFE9FC" stroke="#A695D6" stroke-width="4.5"/>
      <path d="M-27 -6 q8 -10 16 0" fill="none" stroke="#6A5A96" stroke-width="5" stroke-linecap="round"/>
      <path d="M11 -6 q8 -10 16 0" fill="none" stroke="#6A5A96" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="-35" cy="12" rx="11" ry="7" fill="#FFB8CE" opacity="0.75"/>
      <ellipse cx="35" cy="12" rx="11" ry="7" fill="#FFB8CE" opacity="0.75"/>
      <path d="M-8 12 q8 9 16 0" fill="none" stroke="#6A5A96" stroke-width="4.5" stroke-linecap="round"/>
