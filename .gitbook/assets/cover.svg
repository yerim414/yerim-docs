    <rect x="1476" y="166" width="92" height="12" rx="6" fill="#DDE3F0"/>
    <rect x="1476" y="192" width="134" height="12" rx="6" fill="#E8EDF7"/>
    <rect x="1476" y="218" width="66" height="12" rx="6" fill="#E8EDF7"/>
  </g>

  <!-- 반짝이 -->
  <g fill="#FFFFFF">
    <path d="M600 130 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z" opacity="0.95"/>
    <path d="M1320 380 l8 21 21 8 -21 8 -8 21 -8 -21 -21 -8 21 -8z" opacity="0.9"/>
    <path d="M860 80 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" opacity="0.85"/>
    <path d="M1720 300 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z" opacity="0.8"/>
