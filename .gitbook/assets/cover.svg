    <rect x="1455" y="140" width="190" height="126" rx="28" fill="#5B8DBE"/>
  </g>
  <g>
    <rect x="250" y="282" width="220" height="144" rx="30" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="286" cy="316" r="7" fill="#FF9BB8"/>
    <circle cx="310" cy="316" r="7" fill="#FFD08A"/>
    <circle cx="334" cy="316" r="7" fill="#9BDCB4"/>
    <rect x="278" y="346" width="116" height="12" rx="6" fill="#DDE3F0"/>
