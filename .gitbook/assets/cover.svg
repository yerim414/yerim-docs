    <g transform="translate(1120,528)">
      <ellipse cx="-20" cy="-62" rx="12" ry="34" fill="#E4DBFA" stroke="#A695D6" stroke-width="4"/>
      <ellipse cx="20" cy="-62" rx="12" ry="34" fill="#E4DBFA" stroke="#A695D6" stroke-width="4"/>
      <ellipse cx="-20" cy="-62" rx="5" ry="22" fill="#FFC9DC" opacity="0.8"/>
