      <circle cx="40" cy="-42" r="17" fill="#FFD3E2" stroke="#E19AB4" stroke-width="4"/>
      <ellipse cx="0" cy="0" rx="60" ry="56" fill="#FFE3EC" stroke="#E19AB4" stroke-width="4.5"/>
      <circle cx="-20" cy="-6" r="5.5" fill="#8A5568"/>
      <circle cx="20" cy="-6" r="5.5" fill="#8A5568"/>
      <ellipse cx="-36" cy="12" rx="11" ry="7" fill="#FF9FBE" opacity="0.7"/>
      <ellipse cx="36" cy="12" rx="11" ry="7" fill="#FF9FBE" opacity="0.7"/>
      <ellipse cx="0" cy="12" rx="15" ry="11" fill="#FFF3F7"/>
      <path d="M-7 10 q7 8 14 0" fill="none" stroke="#8A5568" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="-46" cy="48" rx="14" ry="10" fill="#FFE3EC" stroke="#E19AB4" stroke-width="4"/>
